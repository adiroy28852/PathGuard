services:
  graph-api:
    build:
      context: .
      dockerfile: graph_api/Dockerfile
    image: pathguard-graph-api:local
    environment:
      FALKORDB_URL: ${FALKORDB_URL:?Set FALKORDB_URL to your FalkorDB Cloud connection URL}
      FALKORDB_GRAPH: ${FALKORDB_GRAPH:-pathguard}
    restart: unless-stopped

  app:
    build: .
    image: pathguard-app:local
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      GRAPH_API_URL: http://graph-api:8100
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    restart: unless-stopped
